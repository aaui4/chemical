{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}"/>


    <div class="overlay">
        

        <!-- Profile Section -->
        <div class="profile-section">
            <div class="profile-card">
                <div class="avatar-large">
                    {% if user and user.avatar %}
                    <img src="{{ url_for('static', filename='uploads/' + user.avatar) }}" alt="Avatar"/>
                    {% else %}
                    <i class="bx bx-user"></i>
                    {% endif %}
                </div>
                <h2 class="profile-name">Welcome,{{ user.username }}</h2>
            </div>

            <!-- Edit Profile Form -->
            <div class="edit-profile">
                <form action="{{ url_for('update_profile') }}" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Username :</label>
                        <input type="text" name="username" placeholder="Username" value="{{ user.username if user else '' }}">
                    </div>
                    
                    <div class="form-group">
                        <label>Email :</label>
                        <input type="email" name="email" placeholder="exmaple@gmail.com" value="{{ user.email if user else '' }}">
                    </div>
                  
                    <div class="form-group">
                        <label for="avatar">Profile Picture:</label>
                        <input type="file" id="avatar" name="avatar" accept="image/*">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>

        

        <!-- Action Buttons -->

        <div class="actions">
            <a href="{{ url_for('simulation.simulation_page') }}" class="btn btn-primary">Start New Simulation</a>
            <a href="{{ url_for('search') }}" class="btn btn-secondary">Browse Reactions</a>
            <a href="{{ url_for('simulation.simulation_history') }}" class="btn primary" >My History</a>
        </div>
    </div>
{% endblock %}
