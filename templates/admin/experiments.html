{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/reaction.css') }}">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>

<title>{{ _('Experiments') }}</title>

<!-- ================= MAIN LAYOUT ================= -->
<div class="container">
    {% include 'admin/sidebar.html' %}

    <main class="main">

        <!-- Top Bar -->
        <div class="topbar">
                <h3>{{ _('Experiments') }}</h3>
            <button type="button" class="add-btn" onclick="openModal()">
              <i class='bx bx-plus'></i> {{ _('Add Reaction') }}
            </button>
        </div>

        <!-- TABLE -->
        <div class="table-box glass-table">
            <h4>{{ _('All Experiments') }}</h4>

            <table>
                <thead>
                    <tr>
                        <th>{{ _('Equation') }}</th>
                        <th>{{ _('Actions') }}</th>
                    </tr>
                </thead>

                <tbody id="reactionTable">
                {% for r in reactions %}
                    <tr>
                        <td>{{ r.equation }}</td>

                        <td class="actions">

                            <!-- EDIT -->
                            <a href="#"
                               class="edit-btn"
                               data-id="{{ r.id }}"
                               data-equation="{{ r.equation }}"
                               onclick="openEditModal(this)">
                                <i class='bx bx-edit'></i>
                            </a>

                            <!-- DELETE -->
                            <form method="POST"
                                  action="{{ url_for('admin.delete_reaction', id=r.id) }}"
                                  style="display:inline;">

                                <button type="submit"
                                        class="delete-btn"
                                        onclick="return confirm('Are you sure?');">
                                    <i class='bx bx-trash'></i>
                                </button>

                            </form>

                        </td>
                    </tr>
                {% endfor %}
                </tbody>

            </table>
        </div>

    </main>
</div>

<!-- ================= ADD MODAL ================= -->
<div id="addModal" class="modal-custom">

    <div class="modal-box add-modal">

        <span class="close-btn" onclick="closeModal()">&times;</span>

        <h2>🧪 {{ _('Add New Reaction') }}</h2>

        <!-- IMPORTANT: id + no submit redirect control -->
        <form id="addForm" method="POST" action="{{ url_for('reaction.add_reaction') }}">

            <div class="form-group">
                <label>⚡ Equation</label>
                <input type="text" name="equation" required>
            </div>

            <div class="form-group">
                <label>📝 Description</label>
                <textarea name="description"></textarea>
            </div>

            <div class="form-group">
                <label>🏷️ Reaction Type</label>
                <select name="reaction_type">
                    <option value="neutralization">Neutralization</option>
                    <option value="precipitation">Precipitation</option>
                    <option value="complex">Complexation</option>
                    <option value="gas">Gas</option>
                    <option value="combustion">Combustion</option>
                    <option value="default">Default</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>🌡️ Temperature</label>
                    <input type="number" name="temperature" step="0.1">
                </div>

                <div class="form-group">
                    <label>💨 Pressure</label>
                    <input type="number" name="pressure" step="0.1">
                </div>
            </div>

            <div class="form-group">
                <label>🎨 Result Color</label>
                <input type="color" name="result_color" value="#ffffff">
            </div>

            <button type="submit" class="submit-btn">
                {{ _('Add Reaction') }}
            </button>

        </form>

    </div>
</div>

<!-- ================= EDIT MODAL ================= -->
<div id="editModal" class="modal-custom">

    <div class="modal-box">

        <span class="close-btn" onclick="closeEditModal()">&times;</span>

        <h2>✏️ Edit Reaction</h2>

        <form method="POST" id="editForm">

            <div class="form-group">
                <label>⚡ Equation</label>
                <input type="text" name="equation" id="editEquation" required>
            </div>

            <button type="submit" class="submit-btn">
                Update
            </button>

        </form>

    </div>
</div>


<!--  Scripts  -->

<script src="{{ url_for('static', filename='js/experiments.js') }}"></script>

{% endblock %}
