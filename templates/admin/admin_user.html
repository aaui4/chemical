<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{{ _('Users') }}</title>

    <link rel="stylesheet" href="/static/css/admin.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
</head>

<body>
    <div class="container">

        {% include 'sidebar.html' %}

        <main class="main">

            <!-- Top Bar -->
            <div class="topbar">
                <h3>{{ _('Admin Control Panel') }}</h3>
            </div>

            <!-- Users Table -->
            <div class="table-box glass-table">
                <h4>{{ _('All Users') }}</h4>

                <table>
                    <thead>
                        <tr>
                            <th>{{ _('ID') }}</th>
                            <th>{{ _('Username') }}</th>
                            <th>{{ _('Email') }}</th>
                            <th>{{ _('Role') }}</th>
                            <th>{{ _('Actions') }}</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for user_item in users %}
                        <tr>
                            <td>{{ user_item[0] }}</td>
                            <td>{{ user_item[1] }}</td>
                            <td>{{ user_item[2] }}</td>
                            <td>{{ user_item[3] }}</td>

                            <td class="actions">

                                <!-- View -->
                                <a href="/admin/user/{{ user_item[0] }}" class="view-btn">
                                    <i class="bx bx-show"></i>
                                </a>

                                <!-- Delete -->
                                <form 
                                    method="POST"
                                    action="/admin/user/{{ user_item[0] }}/delete"
                                    style="display:inline;"
                                    onsubmit="return confirm(`{{ _('Are you sure you want to delete this user? This cannot be undone.') }}`);">
                                    <button type="submit" class="delete-btn">
                                        <i class="bx bx-trash"></i>
                                    </button>
                                </form>

                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

            </div>

        </main>

    </div>
</body>
</html>
